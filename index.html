<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Culture</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
</head>
<body>
<section class="culture">
  <div class="culture__grid">

    <div class="culture__block culture__block--intro">
      <h1 class="culture__title">COMPANY<br>CULTURE</h1>
      <div class="culture__icons">
        <a class="culture__icon" href="https://instagram.com/" aria-label="Перейти в Instagram">
          <img src="icons/instagram-icon.svg" alt="Иконка Instagram" class="culture__icon-img">
        </a>
        <a class="culture__icon" href="tel:+71234567890" aria-label="Позвонить по указанному номеру">
          <img src="icons/phone-icon.svg" alt="Иконка телефона" class="culture__icon-img">
        </a>
        <a class="culture__icon" href="mailto:mail@example.com" aria-label="Написать нам на почту">
          <img src="icons/mail-icon.svg" alt="Иконка почты" class="culture__icon-img">
        </a>
      </div>
    </div>


    <div class="culture__block culture__block--main-photo">
      <picture>
        <source type="image/webp" srcset="images/webp/main-portrait.webp 1x, images/webp/main-portrait-2x.webp 2x">
        <img src="images/main-portrait.png" alt="Основной портрет сотрудника" class="culture__image">
      </picture>
    </div>

    <div class="culture__block culture__block--photo-blue">
      <picture>
        <source type="image/webp" srcset="images/webp/second-portrait.webp 1x, images/webp/second-portrait-2x.webp 2x">
        <img src="images/second-portrait.jpg" alt="Портрет на синем фоне" class="culture__image">
      </picture>
    </div>

    <div class="culture__block culture__block--photo-profile">
      <picture>
        <source type="image/webp" srcset="images/webp/third-portrait.webp 1x, images/webp/third-portrait-2x.webp 2x">
        <img src="images/third-portrait.png" alt="Портрет профиль" class="culture__image">
      </picture>
    </div>

    <div class="culture__block culture__block--photo-room">
      <picture>
        <source type="image/webp" srcset="images/webp/door-entry.webp 1x, images/webp/door-entry-2x.webp 2x">
        <img src="images/door-entry.png" alt="Вход в комнату" class="culture__image">
      </picture>
    </div>

    <div class="culture__block culture__block--photo-red"></div>

    <div class="culture__block culture__block--text">
      <p class="culture__text">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Massa ultricies aliquam egestas amet mi aliquam. Eu, vel massa elementum nulla.
      </p>
    </div>

    <div class="culture__block culture__block--photo-coffee">
      <picture>
        <source type="image/webp" srcset="images/webp/coffee-cup.webp 1x, images/webp/coffee-cup-2x.webp 2x">
        <img src="images/coffee-cup.png" alt="Чашка кофе" class="culture__image">
      </picture>
    </div>

    <div class="culture__block culture__block--photo-brown"></div>

    <div class="culture__block culture__block--photo-man">
      <picture>
        <source type="image/webp" srcset="images/webp/fourth-portrait.webp 1x, images/webp/fourth-portrait-2x.webp 2x">
        <img src="images/fourth-portrait.png" alt="Мужской портрет" class="culture__image">
      </picture>
    </div>

  </div>
</section>
</body>
</html>
